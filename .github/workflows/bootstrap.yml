name: Build Zig release dependencies

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    outputs:
      manifest_sha256:
        description: SHA-256 of the published dependency manifest
        value: ${{ jobs.ready.outputs.sha256 }}

concurrency:
  group: ${{ inputs.tag }}
  queue: max

permissions:
  contents: read

env:
  INPUT_TAG: ${{ inputs.tag }}
  BOOTSTRAP: 0.18.0-dev.1240+74f654a72
  BOOTSTRAP_SHA256: 14c8b8f8c73dce1c4fdbde05459ee940fb56c056c648f2898a36d0f935cad3ef

jobs:
  lookup:
    runs-on: ubuntu-24.04
    outputs:
      missing: ${{ steps.release.outputs.missing }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --retry 3 --output release.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG")
          case "$status" in
            200) jq -e '.draft == false' release.json >/dev/null ;;
            404) echo 'missing=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Dependency lookup failed (HTTP $status)" >&2; exit 1 ;;
          esac

  build:
    needs: lookup
    if: needs.lookup.outputs.missing == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos-none, aarch64-macos-none]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Build dependencies with upstream zig-bootstrap
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          cd "$RUNNER_TEMP"
          archive="zig-bootstrap-$BOOTSTRAP.tar.xz"
          curl --fail --location --retry 3 -o "$archive" "https://ziglang.org/builds/$archive"
          echo "$BOOTSTRAP_SHA256  $archive" | sha256sum -c -
          tar xf "$archive"
          cd "zig-bootstrap-$BOOTSTRAP"
          ./build "$TARGET" baseline

          prefix="out/$TARGET-baseline"
          mkdir -p "$prefix/licenses"
          cp --parents llvm/LICENSE.TXT clang/LICENSE.TXT lld/LICENSE.TXT zlib/LICENSE zstd/LICENSE "$prefix/licenses"
          tar --zstd -cf "$GITHUB_WORKSPACE/$TARGET.tar.zst" -C "$prefix" .

          # All four release jobs run on x86_64 Linux and use this same compiler.
          if [[ "$TARGET" == x86_64-linux-musl ]]; then
            host="out/zig-$TARGET-baseline"
            test "$("$host/zig" version)" = "$BOOTSTRAP"
            tar --zstd -cf "$GITHUB_WORKSPACE/host-zig.tar.zst" -C "$host" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.target }}
          path: '*.tar.zst'
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-*
          merge-multiple: true
      - name: Publish the inputs for tagged Zig builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum host-zig.tar.zst {aarch64,x86_64}-{linux-musl,macos-none}.tar.zst > SHA256SUMS
          gh release create "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Zig build inputs ($BOOTSTRAP)" \
            --notes "Built from upstream zig-bootstrap $BOOTSTRAP (SHA-256: $BOOTSTRAP_SHA256)." \
            *.tar.zst SHA256SUMS

  ready:
    needs: [lookup, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "SHA256SUMS") | .digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Missing SHA256SUMS digest for $INPUT_TAG" >&2; exit 1; }
          echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"

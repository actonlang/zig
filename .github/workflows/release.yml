name: Release Zig

on:
  push:
    tags: ['acton-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to stamp on a test build of the selected ref
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  recipe:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.key.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: |
          [[ "$RELEASE_TAG" =~ ^acton-[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+\+acton\.[0-9]+$ ]] || exit 1
          read -r digest _ < <(sha256sum .github/workflows/bootstrap.yml)
          echo "tag=bootstrap-$digest" >> "$GITHUB_OUTPUT"

  dependencies:
    needs: recipe
    uses: ./.github/workflows/bootstrap.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.recipe.outputs.tag }}

  build:
    needs: [recipe, dependencies]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos-none, aarch64-macos-none]
    env:
      TARGET: ${{ matrix.target }}
      BOOTSTRAP_TAG: ${{ needs.recipe.outputs.tag }}
      MANIFEST_SHA256: ${{ needs.dependencies.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the tagged Zig source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#acton-}

          cd "$RUNNER_TEMP"
          gh release download "$BOOTSTRAP_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --pattern host-zig.tar.zst --pattern "$TARGET.tar.zst"
          echo "$MANIFEST_SHA256  SHA256SUMS" | sha256sum -c -
          for archive in host-zig.tar.zst "$TARGET.tar.zst"; do
            awk -v file="$archive" '$2 == file' SHA256SUMS | sha256sum -c -
          done
          mkdir host target
          tar xf host-zig.tar.zst -C host
          tar xf "$TARGET.tar.zst" -C target

          # The final stage of upstream zig-bootstrap, using the prepared target libraries.
          cd "$GITHUB_WORKSPACE"
          package="zig-${TARGET%-*}-$version"
          "$RUNNER_TEMP/host/zig" build --zig-lib="$GITHUB_WORKSPACE/lib" --prefix "$RUNNER_TEMP/$package" \
            --search-prefix "$RUNNER_TEMP/target" -Dflat -Dstatic-llvm \
            -Doptimize=ReleaseFast -Dstrip -Dtarget="$TARGET" -Dcpu=baseline \
            -Dversion-string="$version"
          tar --sort=name -cJf "$package.tar.xz" -C "$RUNNER_TEMP" "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: zig-${{ matrix.target }}
          path: '*.tar.xz'
          compression-level: 0
          if-no-files-found: error

  check:
    needs: build
    strategy:
      matrix:
        include:
          - {target: x86_64-linux-musl, runner: ubuntu-24.04}
          - {target: aarch64-linux-musl, runner: ubuntu-24.04-arm}
          - {target: x86_64-macos-none, runner: macos-15-intel}
          - {target: aarch64-macos-none, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zig-${{ matrix.target }}
      - name: Run the packaged compiler on its target
        run: |
          archive=(zig-*.tar.xz)
          tar xf "${archive[0]}"
          zig="$PWD/${archive[0]%.tar.xz}/zig"
          test "$("$zig" version)" = "${RELEASE_TAG#acton-}"
          echo 'const std = @import("std"); test { try std.testing.expectEqual(42, @as(u32, 40) + 2); }' > smoke.zig
          "$zig" test smoke.zig -lc -fllvm
          echo 'int main(void) { return 0; }' > smoke.c
          "$zig" cc smoke.c -o smoke
          ./smoke

  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zig-*
          merge-multiple: true
      - name: Publish the four checked archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum zig-*.tar.xz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Zig ${GITHUB_REF_NAME#acton-}" --notes "Built from $GITHUB_SHA." zig-*.tar.xz SHA256SUMS
